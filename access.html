<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFlow UAE - Access App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Afacad+Flux:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Afacad Flux', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #dcfd8b 0%, #bc84ee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            color: #1e293b;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .qr-label {
            color: #475569;
            font-weight: 700;
            font-size: 16px;
        }

        .qr-code {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #e9d5ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-code div {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }

        .divider {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #dcfd8b 0%, #bc84ee 100%);
            margin: 20px 0;
        }

        .link-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .link-label {
            color: #475569;
            font-weight: 700;
            font-size: 16px;
        }

        .link-box {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e9d5ff;
            width: 100%;
            word-break: break-all;
            color: #1e293b;
            font-weight: 600;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9b5de5 0%, #bc84ee 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(155, 93, 229, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #1e293b;
            border: 2px solid #e9d5ff;
        }

        .btn-secondary:hover {
            background: #e9d5ff;
        }

        .info {
            background: #eff6ff;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #bc84ee;
            color: #1e293b;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌿 EcoFlow UAE</h1>
        <p class="subtitle">Team 7G3 Smart City Optimizer</p>

        <div class="qr-section">
            <p class="qr-label">📱 Scan QR Code</p>
            <div class="qr-code" id="qrcode"></div>
        </div>

        <div class="divider"></div>

        <div class="link-section">
            <p class="link-label">🔗 Or Copy Link</p>
            <div class="link-box" id="link-display">https://weema1708.github.io/Eco-Flow-UAE/index.html</div>
            <button class="btn btn-secondary" onclick="copyLink()">
                <i class="fa-solid fa-copy"></i> Copy Link
            </button>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="openApp()">
                <i class="fa-solid fa-arrow-right"></i> Open App Now
            </button>
        </div>

        <div class="info">
            ✨ Access the EcoFlow app directly from this page. Scan the QR code or use the link to get started with real-time air quality and traffic optimization!
        </div>
    </div>

    <script>
        // Get the app URL
        const appUrl = "https://weema1708.github.io/Eco-Flow-UAE/index.html";

        // Generate QR Code on page load
        document.addEventListener('DOMContentLoaded', function() {
            new QRCode(document.getElementById("qrcode"), {
                text: appUrl,
                width: 250,
                height: 250,
                colorDark: "#1e293b",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        });

        function copyLink() {
            const link = document.getElementById('link-display').innerText;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Link copied to clipboard!');
            }).catch(() => {
                alert('Could not copy link');
            });
        }

        function openApp() {
            window.open(appUrl, '_blank');
        }
    </script>

</body>
</html>
